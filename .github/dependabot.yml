version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "ci"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    commit-message:
      prefix: "build"
    labels: ["dependencies"]
