name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check only, publish nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          uv venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          uv pip install -e ".[dev]"

      - name: The tag must match the version in the package
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import sys

          import reflex_icd11ect

          tag = os.environ["TAG"].removeprefix("v")
          version = reflex_icd11ect.__version__
          if tag != version:
              sys.exit(f"tag v{tag} does not match __version__ {version}")
          print(f"releasing {version}")
          PY

      - name: Test
        run: pytest -q

      - name: Build the distributions
        run: python -m build

      - name: Check the metadata PyPI will render
        run: twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  github-release:
    name: github release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Attest the provenance of the distributions
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - name: Extract this version's changelog entry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          version = os.environ["TAG"].removeprefix("v")
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"^## \[{re.escape(version)}\].*?$(.*?)(?=^## \[|\Z)",
              changelog,
              re.MULTILINE | re.DOTALL,
          )
          body = match.group(1).strip() if match else "See CHANGELOG.md."
          pathlib.Path("release-notes.md").write_text(body + "\n", encoding="utf-8")
          print(body)
          PY

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --notes-file release-notes.md \
            --verify-tag

  pypi:
    name: publish to pypi
    needs: [build, github-release]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # Trusted Publishing: PyPI verifies this workflow's OIDC identity, so no
    # API token is stored in the repository. The environment name below is
    # part of what PyPI checks, keep it in sync with the publisher there.
    environment:
      name: pypi
      url: https://pypi.org/p/reflex-icd11ect
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
          print-hash: true
