[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reflex-icd11ect"
version = "0.1.0"
description = "Reflex custom component for the WHO ICD-11 Embedded Classification Tools (Embedded Coding Tool and Embedded Browser)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Ernesto Crespo", email = "ecrespo@gmail.com" }]
keywords = [
    "reflex",
    "reflex-custom-components",
    "icd11",
    "icd-11",
    "icd11ect",
    "who",
    "medical-coding",
    "healthcare",
    "terminology",
]
dependencies = ["reflex>=0.9.0", "httpx>=0.27"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Reflex",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Software Development :: User Interfaces",
]

[project.urls]
Homepage = "https://github.com/ecrespo/reflex-icd11ect"
Source = "https://github.com/ecrespo/reflex-icd11ect"
Issues = "https://github.com/ecrespo/reflex-icd11ect/issues"
"ECT documentation" = "https://icd.who.int/docs/icd-api/icd11ect/"

[project.optional-dependencies]
dev = ["build", "twine", "pytest>=8", "pytest-cov", "ruff"]
security = ["bandit[toml]", "pip-audit"]

[tool.setuptools.packages.find]
where = ["custom_components"]

[tool.setuptools.package-data]
# PEP 561 marker plus the generated stubs, so type checkers see the API.
reflex_icd11ect = ["py.typed", "*.pyi"]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = [".web", "dist"]

[tool.ruff.lint]
# The stubs are generated by `reflex component build`, we do not own their style.
exclude = ["*.pyi"]
select = ["E", "F", "I", "UP", "B", "D", "SIM", "RUF"]
ignore = ["D203", "D213"]

[tool.ruff.format]
exclude = ["*.pyi", "*.md"]

[tool.ruff.lint.per-file-ignores]
# The JavaScript runtime is a template string; keeping it readable as JS
# matters more than the Python line length.
"custom_components/reflex_icd11ect/_runtime.py" = ["E501"]
"tests/*" = ["D", "E501"]
# Mutable defaults are how Reflex declares state vars.
"icd11ect_demo/*" = ["D", "RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["reflex_icd11ect"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.bandit]
# The demo app and the tests are not shipped to users.
exclude_dirs = [".venv", ".web", "build", "dist", "icd11ect_demo", "tests"]
